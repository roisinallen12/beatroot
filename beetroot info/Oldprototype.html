<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Looped</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --surface: #f8f8f8;
  --surface2: #f0f0f0;
  --surface3: #e8e8e8;
  --border: #e0e0e0;
  --border2: #d0d0d0;
  --accent: #000000;
  --accent-dim: rgba(0,0,0,0.08);
  --red: #ff4d6d;
  --red-dim: rgba(255,77,109,0.1);
  --text: #1a1a1a;
  --muted: #888888;
  --muted2: #aaaaaa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; background: #e5e5e5; color: var(--text); font-family: 'Poppins', sans-serif; }

/* iPhone 17 sized container */
.app {
  width: 393px;
  height: 852px;
  max-height: 100vh;
  margin: 20px auto;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  position: relative;
}

/* ── HEADER ───────────────────────── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; flex-shrink: 0;
}
.back-link {
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 13px;
  cursor: pointer; transition: color 0.15s;
}
.back-link:hover { color: var(--text); }
.back-link svg { width: 16px; height: 16px; }
.header-right { display: flex; gap: 8px; }
.hbtn {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--muted); transition: all 0.18s;
}
.hbtn:hover { color: var(--text); border-color: var(--border2); }

/* ── LYRICS PANEL ────────────────────── */
.lyrics-panel {
  flex: 1; display: flex; flex-direction: column;
  padding: 0 20px; min-height: 0; overflow: hidden;
}
.song-title {
  font-family: 'Poppins', sans-serif; font-size: 18px; font-weight: 600;
  color: var(--text); background: transparent; border: none;
  padding: 8px 0; margin-bottom: 4px; width: 100%;
  outline: none;
}
.song-title::placeholder { color: var(--muted2); }
.lyrics-area {
  flex: 1; background: transparent; border: none; resize: none;
  font-family: 'Poppins', sans-serif; font-size: 14px; line-height: 1.8;
  color: var(--text); padding: 0; width: 100%;
  outline: none; min-height: 0;
}
.lyrics-area::placeholder { color: var(--muted2); }

/* ── LOOPING CLIP BAR (overdub) ─────────── */
.looping-clip-bar {
  display: none; padding: 0 20px; margin-bottom: 8px;
  position: relative; z-index: 60; background: var(--bg);
}
.looping-clip-bar.visible { display: block; }
.looping-clip-bar-inner {
  position: relative; height: 50px;
  background: var(--surface2); border-radius: 10px;
  border: 1px solid var(--border); overflow: hidden;
}
.looping-clip-bar .looping-waveform {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; gap: 1px;
}
.looping-clip-bar .looping-waveform .waveform-bar {
  width: 2px; min-width: 2px; flex-shrink: 0;
  background: var(--border2); border-radius: 1px;
}
.looping-clip-bar .looping-waveform-progress {
  position: absolute; left: 0; top: 8px; bottom: 8px;
  width: 3px; background: var(--accent); border-radius: 2px;
  animation: loopingBarProgress var(--loop-duration, 3s) linear infinite;
}
@keyframes loopingBarProgress {
  0% { left: 0; }
  100% { left: 100%; }
}
.looping-clip-bar-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
}
.looping-clip-bar .looping-clip-name {
  font-size: 12px; font-weight: 600; color: var(--text);
  background: rgba(255,255,255,0.9); padding: 4px 10px; border-radius: 6px;
}
.looping-clip-bar .looping-clip-timer {
  font-size: 16px; font-weight: 500; color: var(--text);
}
.looping-clip-bar .looping-clip-stop {
  font-size: 11px; font-weight: 500; color: var(--muted);
  background: rgba(255,255,255,0.9); padding: 4px 10px; border-radius: 6px;
  border: none; cursor: pointer;
}
.looping-clip-bar .looping-clip-stop:hover { background: #fff; color: var(--text); }

/* ── WAVEFORM DISPLAY ────────────────── */
.waveform-zone {
  flex-shrink: 0; padding: 0 20px; display: none;
  position: relative; z-index: 60; background: var(--bg);
}
.waveform-zone.visible { display: block; }
.waveform-container {
  background: #1a1a1a; border: 2px solid transparent;
  border-radius: 12px; padding: 16px 16px; position: relative;
  height: 100px; overflow: hidden;
}
.waveform-zone.arrangement .waveform-container {
  border-radius: 0 0 12px 12px;
}
/* Section view waveform stroke colors */
.waveform-zone.section-view-1 .waveform-container { border-color: #2563eb; }
.waveform-zone.section-view-2 .waveform-container { border-color: #7c3aed; }
.waveform-zone.section-view-3 .waveform-container { border-color: #db2777; }
.waveform-zone.section-view-4 .waveform-container { border-color: #059669; }
.waveform-zone.section-view-5 .waveform-container { border-color: #d97706; }
.waveform-zone.section-view-6 .waveform-container { border-color: #ea580c; }

.waveform-display {
  position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
  display: flex; align-items: center; justify-content: center;
  gap: 2px; height: 60px; overflow: hidden;
}
/* Recording mode - waveform grows from center, bars go left */
.waveform-zone.recording .waveform-display {
  flex-direction: row; /* Normal order */
  justify-content: flex-end; /* Push bars to right edge (center) */
  right: calc(50% - 2px); /* Right edge at center, slight offset for playhead */
  left: 16px;
}
.waveform-zone.recording .waveform-playhead {
  display: none;
}
/* Recording playhead - cyan marker in CENTER during recording */
.recording-playhead {
  position: absolute; top: 8px; bottom: 8px;
  width: 4px; background: #22d3d1; border-radius: 2px;
  z-index: 20; pointer-events: none;
  left: 50%; transform: translateX(-50%);
}
.recording-playhead::before {
  content: ''; position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; background: #22d3d1; border-radius: 50%;
}
.recording-playhead::after {
  content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; background: #22d3d1; border-radius: 50%;
}
.waveform-zone.has-clip .waveform-display {
  left: 16px; right: 16px; justify-content: center; gap: 1px;
}
.waveform-zone.arrangement .waveform-display {
  left: 8px; right: 8px; justify-content: space-between; gap: 1px;
}
.waveform-zone.has-clip .waveform-bar {
  width: 2px; min-width: 2px; flex-shrink: 0;
}
.waveform-zone.arrangement .waveform-bar {
  flex: 1; min-width: 1px; max-width: 4px;
}
.waveform-zone.has-clip .waveform-playhead { display: none; }

/* Loop playback progress indicator */
.waveform-progress {
  position: absolute; left: 16px; top: 20px; bottom: 20px;
  width: 3px; background: #3b82f6; border-radius: 2px;
  opacity: 0; pointer-events: none;
}
.waveform-progress::before {
  content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  width: 10px; height: 10px; background: #3b82f6; border-radius: 50%;
}
.waveform-zone.playing .waveform-progress {
  opacity: 1;
  animation: loopProgress var(--loop-duration, 3s) linear infinite;
}
.waveform-zone.arrangement.playing .waveform-progress {
  animation: loopProgress var(--loop-duration, 3s) linear forwards;
}
@keyframes loopProgress {
  0% { left: 16px; }
  100% { left: calc(100% - 16px); }
}

/* Arrangement section dividers */
.arrangement-divider {
  position: absolute; top: 10px; bottom: 10px;
  width: 2px; background: #a855f7; border-radius: 1px;
  transform: translateX(-50%);
}
/* Bookmark highlighting during recording */
.waveform-bookmarks {
  position: absolute; left: 16px; right: 16px; top: 0; bottom: 0;
  pointer-events: none;
}
/* Bookmarked bars get teal/cyan color */
.waveform-bar.bookmarked {
  background: #22d3d1 !important;
}
/* Clip indicator */
.bookmark-clip-indicator {
  position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%);
  background: #22d3d1; color: #000; padding: 4px 12px; border-radius: 12px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  animation: clipIndicatorPop 0.3s ease-out;
}
@keyframes clipIndicatorPop {
  0% { transform: translateX(-50%) scale(0); opacity: 0; }
  50% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); opacity: 1; }
}
.waveform-stop-loop {
  position: absolute; top: 8px; right: 8px;
  padding: 4px 10px; border-radius: 6px;
  background: rgba(255,255,255,0.15); color: #fff;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; transition: background 0.15s;
  font-size: 11px; font-weight: 500; text-transform: lowercase;
}
.waveform-stop-loop:hover { background: rgba(255,255,255,0.25); }
.waveform-zone.playing .waveform-stop-loop { display: flex; }
.waveform-buttons {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 4px; padding: 0 0; position: relative; z-index: 100;
}
.waveform-play-btn, .waveform-loop-btn {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.15s;
}
.waveform-play-btn:hover, .waveform-loop-btn:hover { background: var(--surface3); }
.waveform-play-btn svg { width: 16px; height: 16px; margin-left: 2px; }
.waveform-loop-btn svg { width: 18px; height: 18px; }
.waveform-loop-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.waveform-bar {
  width: 2px; min-width: 2px; flex-shrink: 0;
  background: #888888; border-radius: 1px;
}
.waveform-center-line {
  position: absolute; left: 16px; right: 16px; top: 50%;
  height: 1px; background: rgba(255,255,255,0.1);
}
.waveform-playhead {
  position: absolute; left: 50%; top: 20px; bottom: 20px;
  width: 2px; background: #3b82f6; border-radius: 1px;
  transform: translateX(-50%);
}
.waveform-playhead::before {
  content: ''; position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
  width: 8px; height: 8px; background: #3b82f6; border-radius: 50%;
}
.waveform-timer {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  margin-bottom: 8px;
  font-family: 'Poppins', sans-serif; font-size: 24px; font-weight: 500;
  color: var(--text); letter-spacing: 0.02em;
}

/* ── BOTTOM CONTROLS ─────────────────── */
.bottom-controls {
  flex-shrink: 0; padding: 0 20px 28px;
  display: flex; align-items: center; justify-content: center;
  position: relative; z-index: 60; background: var(--bg);
}
.bottom-left {
  position: absolute; left: 20px; bottom: 28px;
  display: none; align-items: center; gap: 8px;
}
.bottom-left.visible { display: flex; }
.bottom-left.clips-open .ctrl-btn { display: none !important; }
.ctrl-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s; position: relative;
}
.ctrl-btn:hover { color: var(--text); border-color: var(--border2); background: var(--surface3); }
.ctrl-btn .badge {
  position: absolute; bottom: -4px; left: -4px;
  min-width: 16px; height: 16px; padding: 0 4px;
  background: var(--accent); color: var(--bg); border-radius: 8px;
  font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.play-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s;
}
.play-btn:hover { color: var(--text); border-color: var(--border2); }
.play-btn svg { width: 14px; height: 14px; margin-left: 2px; }

.bottom-right {
  position: absolute; right: 20px; bottom: 28px;
  display: none;
}
.bottom-right.visible { display: flex; }

.loop-btn {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.18s;
}
.loop-btn:hover { color: var(--text); border-color: var(--border2); }
.loop-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

.mic-btn {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--accent);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
  box-shadow: 0 4px 20px rgba(0,0,0,0.15), 0 2px 6px rgba(0,0,0,0.1);
}
.mic-btn:hover { transform: scale(1.06); }
.mic-btn.rec {
  background: var(--red);
  box-shadow: 0 0 0 6px rgba(255,77,109,0.15), 0 4px 20px rgba(255,77,109,0.4);
  animation: mpulse 1.5s ease-in-out infinite;
}
@keyframes mpulse {
  0%,100%{box-shadow:0 0 0 6px rgba(255,77,109,0.15),0 4px 20px rgba(255,77,109,0.4)}
  50%    {box-shadow:0 0 0 14px rgba(255,77,109,0.06),0 4px 28px rgba(255,77,109,0.5)}
}
.mic-btn svg { width: 28px; height: 28px; }
.mic-btn svg path, .mic-btn svg line, .mic-btn svg rect { stroke: #fff; }
.mic-btn svg rect { fill: #fff; }

/* ── CLIPS HINT CONTAINER (on white background above clips) ─── */
.clips-hint-container {
  position: absolute; left: 0; right: 0;
  top: 60px; height: 50px;
  background: var(--bg);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 49;
}
.clips-hint-container.visible { display: flex; }
.clips-drag-handle {
  width: 40px; height: 4px; background: var(--border2);
  border-radius: 2px; margin-bottom: 6px;
  cursor: grab;
}
.clips-hint {
  text-align: center; font-size: 11px; color: var(--muted);
}

/* ── CLIPS VIEW ───────────────────── */
.clips-view {
  position: absolute; left: 0; right: 0;
  top: 110px; bottom: 260px;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateY(calc(100% + 300px)); 
  transition: transform 0.3s ease, background 0.2s ease;
  z-index: 50; 
  border-radius: 24px 24px 0 0;
  border-bottom: 1px solid var(--border);
}
.clips-view.visible { transform: translateY(0); }
/* Section view pastel backgrounds */
.clips-view.section-view-1 { background: rgba(219, 234, 254, 0.4); }
.clips-view.section-view-2 { background: rgba(237, 233, 254, 0.4); }
.clips-view.section-view-3 { background: rgba(252, 231, 243, 0.4); }
.clips-view.section-view-4 { background: rgba(209, 250, 229, 0.4); }
.clips-view.section-view-5 { background: rgba(254, 243, 199, 0.4); }
.clips-view.section-view-6 { background: rgba(255, 237, 213, 0.4); }
.clips-list {
  flex: 1; overflow-y: auto; padding: 0 16px 20px;
}
.clips-empty {
  text-align: center; padding: 60px 20px; color: var(--muted);
  font-size: 14px;
}

/* ── SECTION TABS ROW ─────────────────── */
.section-tabs-row {
  display: none; flex-direction: column; gap: 4px;
  padding: 8px 20px; background: var(--bg);
  position: relative; z-index: 70;
}
.section-tabs-row.visible { display: flex; }
.section-tabs-top {
  display: flex; justify-content: flex-end; align-items: center;
}
.section-close-btn, .section-play-btn {
  width: 32px; height: 32px; border-radius: 8px;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
.section-close-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
}
.section-close-btn:hover { color: var(--text); border-color: var(--border2); }
.section-tabs-inner {
  display: flex; align-items: center; gap: 8px; width: 100%;
}
.section-play-btn {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--accent); border: none; color: #fff;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.section-play-btn:hover { opacity: 0.9; }
.section-tabs {
  display: flex; gap: 8px; overflow-x: auto; flex: 1;
  scrollbar-width: none;
}
.section-tabs::-webkit-scrollbar { display: none; }
/* Pastel colors for section tabs */
.section-tab {
  padding: 8px 16px; border-radius: 6px;
  background: var(--surface2); border: 2px solid transparent;
  font-size: 12px; font-weight: 500; color: var(--text);
  cursor: pointer; white-space: nowrap; flex: 1;
  transition: all 0.15s; text-align: center;
}
/* Pastel backgrounds for each section position */
.section-tab:nth-child(1) { background: #dbeafe; color: #1e40af; } /* blue pastel */
.section-tab:nth-child(2) { background: #ede9fe; color: #5b21b6; } /* purple pastel */
.section-tab:nth-child(3) { background: #fce7f3; color: #9d174d; } /* pink pastel */
.section-tab:nth-child(4) { background: #d1fae5; color: #065f46; } /* green pastel */
.section-tab:nth-child(5) { background: #fef3c7; color: #92400e; } /* yellow pastel */
.section-tab:nth-child(6) { background: #ffedd5; color: #9a3412; } /* orange pastel */

/* Selected section tab - darker stroke */
.section-tab.selected:nth-child(1) { border-color: #2563eb; background: #dbeafe; }
.section-tab.selected:nth-child(2) { border-color: #7c3aed; background: #ede9fe; }
.section-tab.selected:nth-child(3) { border-color: #db2777; background: #fce7f3; }
.section-tab.selected:nth-child(4) { border-color: #059669; background: #d1fae5; }
.section-tab.selected:nth-child(5) { border-color: #d97706; background: #fef3c7; }
.section-tab.selected:nth-child(6) { border-color: #ea580c; background: #ffedd5; }

/* Full-width section tab in section view */
.section-tab.full-width {
  display: flex; align-items: center; justify-content: center;
  position: relative; gap: 8px;
}
.section-tab-close {
  position: absolute; right: 12px;
  font-size: 14px; font-weight: 600;
  opacity: 0.6; cursor: pointer;
  padding: 4px 8px; border-radius: 4px;
  transition: all 0.15s;
}
.section-tab-close:hover { opacity: 1; background: rgba(0,0,0,0.1); }

/* During playback, tabs stretch to match waveform sections */
.section-tabs-row.playing .section-tabs {
  gap: 4px;
}
.section-tabs-row.playing .section-tab {
  flex-shrink: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.section-tab:hover { opacity: 0.9; }
.section-tab.has-clips { opacity: 1; }

/* Arrangement playback tab colors to match waveform sections */
.section-tabs-row.playing .section-tab:nth-child(1) { background: #60a5fa; border-color: #60a5fa; color: #fff; }
.section-tabs-row.playing .section-tab:nth-child(2) { background: #a78bfa; border-color: #a78bfa; color: #fff; }
.section-tabs-row.playing .section-tab:nth-child(3) { background: #f472b6; border-color: #f472b6; color: #fff; }
.section-tabs-row.playing .section-tab:nth-child(4) { background: #34d399; border-color: #34d399; color: #fff; }
.section-tabs-row.playing .section-tab:nth-child(5) { background: #fbbf24; border-color: #fbbf24; color: #fff; }
.section-tabs-row.playing .section-tab:nth-child(6) { background: #fb923c; border-color: #fb923c; color: #fff; }
.section-tabs-row.playing .section-tab { opacity: 0.5; }
.section-tabs-row.playing .section-tab.active { opacity: 1; }
.section-add-btn {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  font-size: 16px; color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.section-add-btn:hover { color: var(--text); border-color: var(--border2); }

/* ── CLIP CARD ─────────────────────── */
.clip-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
  cursor: pointer; transition: all 0.15s;
  position: relative;
}
.clip-card:hover { border-color: var(--border2); }
.clip-card.selected { border-color: var(--accent); background: var(--accent-dim); }

.clip-menu {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
  color: var(--muted); cursor: pointer; border-radius: 4px; font-size: 16px;
}
.clip-menu:hover { background: var(--surface3); color: var(--text); }

.clip-main {
  display: flex; gap: 12px; margin-bottom: 10px;
}
.clip-thumbnail {
  width: 64px; height: 64px; border-radius: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; position: relative;
  font-size: 24px;
}
.clip-play-btn {
  position: absolute; bottom: -6px; right: -6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.clip-play-btn svg { width: 10px; height: 10px; margin-left: 1px; }

.clip-content { flex: 1; min-width: 0; }
.clip-header { display: flex; align-items: center; margin-bottom: 6px; }
.clip-name { font-size: 13px; color: var(--text); font-weight: 600; }
.clip-waveform-line {
  height: 24px; margin-bottom: 6px;
  background: linear-gradient(to right, var(--border2) 1px, transparent 1px);
  background-size: 3px 100%;
  border-radius: 4px;
  position: relative;
}
.clip-waveform-line::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%;
  height: 2px; background: var(--border2); transform: translateY(-50%);
}
.clip-card.selected .clip-waveform-line::before { background: var(--accent); opacity: 0.6; }
.clip-duration { font-size: 11px; color: var(--muted); font-weight: 500; text-align: right; }

/* Arrangement toggle row (for clips in sections) */
/* Radio button for arrangement */
.clip-radio {
  position: absolute; top: 10px; right: 10px;
  width: 24px; height: 24px; border-radius: 50%;
  background: #e0e0e0; cursor: pointer;
  transition: all 0.15s; z-index: 2;
}
.clip-radio:hover { background: #ccc; }
.clip-radio.on {
  background: #22c55e; /* bright green */
}
.clip-radio.on.pulsing {
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.15); opacity: 0.8; }
}

.clip-sections {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.clip-add-to-song {
  font-size: 11px; padding: 6px 14px; border-radius: 8px;
  background: var(--accent); border: none;
  color: #fff; cursor: pointer; transition: all 0.15s;
  font-weight: 500;
}
.clip-add-to-song:hover { opacity: 0.9; }
.clip-section-tag {
  font-size: 10px; padding: 4px 10px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; transition: all 0.15s;
}
.clip-section-tag:hover { border-color: var(--border2); color: var(--text); }
/* Pastel colors for clip section tags - matching section tabs */
.clip-section-tag:nth-child(1) { background: #dbeafe; color: #1e40af; border-color: #dbeafe; }
.clip-section-tag:nth-child(2) { background: #ede9fe; color: #5b21b6; border-color: #ede9fe; }
.clip-section-tag:nth-child(3) { background: #fce7f3; color: #9d174d; border-color: #fce7f3; }
.clip-section-tag:nth-child(4) { background: #d1fae5; color: #065f46; border-color: #d1fae5; }
.clip-section-tag:nth-child(5) { background: #fef3c7; color: #92400e; border-color: #fef3c7; }
.clip-section-tag:nth-child(6) { background: #ffedd5; color: #9a3412; border-color: #ffedd5; }
/* Active state - darker border */
.clip-section-tag.active:nth-child(1) { border-color: #2563eb; }
.clip-section-tag.active:nth-child(2) { border-color: #7c3aed; }
.clip-section-tag.active:nth-child(3) { border-color: #db2777; }
.clip-section-tag.active:nth-child(4) { border-color: #059669; }
.clip-section-tag.active:nth-child(5) { border-color: #d97706; }
.clip-section-tag.active:nth-child(6) { border-color: #ea580c; }
.clip-add-section {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 14px; transition: all 0.15s;
}
.clip-add-section:hover { border-color: var(--border2); color: var(--text); }

/* ── TOAST ────────────────────────── */
.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface3); border: 1px solid var(--border2);
  border-radius: 20px; padding: 7px 16px; font-size: 10px;
  color: var(--text); letter-spacing: 0.05em;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 200; white-space: nowrap; pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="back-link" onclick="showToast('All Projects')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <span>Projects</span>
    </div>
    <div class="header-right">
      <div class="hbtn" onclick="showToast('Metronome: 120 BPM')" title="Metronome">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L8 22h8L12 2z"/>
          <path d="M12 6l5 5"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- LYRICS PANEL -->
  <div class="lyrics-panel" id="lyrics-panel">
    <input type="text" class="song-title" id="song-title" placeholder="Song title...">
    <textarea class="lyrics-area" id="lyrics-area" placeholder="Write your lyrics here..."></textarea>
  </div>

  <!-- LOOPING CLIP BAR (shown during overdub) -->
  <div class="looping-clip-bar" id="looping-clip-bar">
    <div class="looping-clip-bar-inner">
      <div class="looping-waveform" id="looping-waveform"></div>
      <div class="looping-clip-bar-overlay">
        <span class="looping-clip-name" id="looping-clip-name"></span>
        <span class="looping-clip-timer" id="looping-clip-timer">0:00</span>
        <button class="looping-clip-stop" onclick="stopLooping()">stop</button>
      </div>
    </div>
  </div>

  <!-- SECTION TABS ROW (above waveform) -->
  <div class="section-tabs-row" id="section-tabs-row">
    <div class="section-tabs-inner">
      <div class="section-tabs" id="section-tabs"></div>
    </div>
  </div>

  <!-- WAVEFORM (visible during recording) -->
  <div class="waveform-zone" id="waveform-zone">
    <div class="waveform-timer" id="waveform-timer">0:00</div>
    <div class="waveform-container" id="waveform-container" onclick="addBookmark(event)">
      <div class="waveform-center-line"></div>
      <div class="waveform-display" id="waveform-display"></div>
      <div class="recording-playhead" id="recording-playhead" style="display:none;"></div>
      <div class="waveform-playhead"></div>
      <div class="waveform-progress"></div>
      <div class="waveform-bookmarks" id="waveform-bookmarks"></div>
      <div class="waveform-stop-loop" id="waveform-stop-loop" onclick="stopLooping()">stop</div>
    </div>
    <div class="waveform-buttons">
      <div class="waveform-play-btn" onclick="playArrangementOrClip()">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <div class="waveform-loop-btn" id="waveform-loop-btn" onclick="toggleLoop()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 2l4 4-4 4"/>
          <path d="M3 11V9a4 4 0 014-4h14"/>
          <path d="M7 22l-4-4 4-4"/>
          <path d="M21 13v2a4 4 0 01-4 4H3"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- BOTTOM CONTROLS -->
  <div class="bottom-controls">
    <div class="bottom-left" id="bottom-left">
      <div class="ctrl-btn" id="clips-btn" onclick="toggleClipsView()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span class="badge" id="clips-badge" style="display:none">0</span>
      </div>
    </div>

    <div class="mic-btn" id="mic-btn" onclick="toggleMic()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0014 0"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
      </svg>
    </div>
  </div>

  <!-- CLIPS HINT (above clips view, on white background) -->
  <div class="clips-hint-container" id="clips-hint-container">
    <div class="clips-drag-handle" id="clips-drag-handle"></div>
    <div class="clips-hint">Swipe down to hide</div>
  </div>

  <!-- CLIPS VIEW (slides up) -->
  <div class="clips-view" id="clips-view">
    <div class="clips-list" id="clips-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────
let clips = [];
let clipN = 1;
let sections = [];
let isRec = false, timerSecs = 0, timerIv = null, waveIv = null;
let selectedClipId = null;
let isLooping = false;
let overdubClipId = null; // The clip being looped during overdub
let selectedSection = null; // Currently selected section filter
let sectionTabsVisible = false;
let bookmarks = []; // Completed bookmark regions [{startTime, endTime}]
let activeBookmark = null; // Currently recording bookmark {startTime} or null
let recordingBars = []; // Store all bar heights during recording
let barTimeMap = []; // Map bar index to recording time (in ms)

const INSTRUMENTS = ['🎸', '🎹', '🎤', '🥁', '🎺', '🎻'];

// ── BOOT ───────────────────────
function boot() {
  updateClipsBadge();
  setupSwipeToHide();
}

function uid() { return Date.now() + Math.random(); }
function genBars() { return Array.from({length:80}, () => Math.random()*0.85+0.1); }

// ── RECORDING ──────────────────────
function toggleMic() { 
  if (!isRec) startRec(); 
  else stopRecording(); 
}

function addWaveformBar() {
  const display = document.getElementById('waveform-display');
  const currentTime = timerSecs * 1000; // Convert to ms for precision
  
  const bar = document.createElement('div');
  bar.className = 'waveform-bar';
  const height = Math.random() * 46 + 4;
  const normalizedHeight = height / 50; // Store normalized 0-1 value
  bar.style.height = `${height}px`;
  
  // Track bar index and time
  const barIndex = recordingBars.length;
  recordingBars.push(normalizedHeight);
  barTimeMap.push(currentTime);
  bar.dataset.barIndex = barIndex;
  bar.dataset.time = currentTime;
  
  // If bookmark is active, highlight this bar in teal
  // New bars appear at the RIGHT (at center playhead) and shift LEFT
  // So bookmarked bars start at center and grow leftward
  if (activeBookmark !== null) {
    bar.classList.add('bookmarked');
  }
  
  // Append bar at the END - with justify-content: flex-end, newest bars appear at right (center)
  // and older bars shift left
  display.appendChild(bar);
  
  // Limit bars to prevent performance issues (remove oldest bars from beginning/left)
  if (display.children.length > 300) {
    display.removeChild(display.firstChild);
  }
}

// ── BOOKMARKING ──────────────────────
function addBookmark(event) {
  // Only add bookmarks during recording
  if (!isRec) return;
  
  // Don't add bookmark if clicking on stop button
  if (event.target.classList.contains('waveform-stop-loop')) return;
  
  const currentTime = timerSecs * 1000; // Current recording time in ms
  const playhead = document.getElementById('recording-playhead');
  
  if (activeBookmark === null) {
    // Start a new bookmark at current time
    activeBookmark = { startTime: currentTime };
    // Show teal playhead at center
    playhead.style.display = 'block';
    showToast('Bookmark started');
  } else {
    // End the active bookmark at current time
    activeBookmark.endTime = currentTime;
    bookmarks.push(activeBookmark);
    
    // Hide teal playhead
    playhead.style.display = 'none';
    
    // Show clip created indicator
    showBookmarkClipIndicator();
    
    activeBookmark = null; // Reset for next bookmark
    
    showToast(`+1 clip from bookmark`);
  }
}

function showBookmarkClipIndicator() {
  // Show a brief "+1 new clip" indicator
  const indicator = document.createElement('div');
  indicator.className = 'bookmark-clip-indicator';
  indicator.textContent = '+1 new clip';
  document.getElementById('waveform-zone').appendChild(indicator);
  
  setTimeout(() => indicator.remove(), 2000);
}

function showRecordingWithBookmarks() {
  // Show the full recording waveform with bookmarked regions highlighted
  const zone = document.getElementById('waveform-zone');
  const display = document.getElementById('waveform-display');
  const timer = document.getElementById('waveform-timer');
  const playhead = document.getElementById('recording-playhead');
  
  zone.classList.add('visible', 'has-clip');
  zone.classList.remove('recording', 'arrangement');
  timer.style.display = 'none';
  playhead.style.display = 'none';
  
  // Reset display styles for full waveform view
  display.style.left = '16px';
  display.style.right = '16px';
  display.style.justifyContent = 'center';
  display.style.flexDirection = 'row'; // Reset from row-reverse
  
  // Debug: log bookmarks to verify they're being saved
  console.log('Bookmarks:', bookmarks);
  console.log('Bar time map:', barTimeMap);
  
  // Rebuild waveform with all bars in chronological order (oldest to newest, left to right)
  display.innerHTML = recordingBars.map((h, idx) => {
    const barTime = barTimeMap[idx];
    // Check if this bar's time falls within any bookmark region
    const isBookmarked = bookmarks.some(b => barTime >= b.startTime && barTime <= b.endTime);
    const color = isBookmarked ? '#22d3d1' : '#9ca3af';
    return `<div class="waveform-bar" style="height:${Math.round(h * 50)}px; background:${color}"></div>`;
  }).join('');
}

function startRec() {
  isRec = true; 
  timerSecs = 0;
  bookmarks = []; // Clear bookmarks for new recording
  activeBookmark = null; // Reset active bookmark
  recordingBars = []; // Clear recorded bars
  barTimeMap = []; // Clear time map
  
  // Clear and reset waveform display FIRST
  const waveformDisplay = document.getElementById('waveform-display');
  const waveformZone = document.getElementById('waveform-zone');
  const bookmarksContainer = document.getElementById('waveform-bookmarks');
  const recordingPlayhead = document.getElementById('recording-playhead');
  
  waveformDisplay.innerHTML = '';
  waveformDisplay.style.width = '';
  waveformDisplay.style.justifyContent = '';
  waveformDisplay.style.left = '';
  waveformDisplay.style.right = '';
  waveformDisplay.style.gap = '';
  bookmarksContainer.innerHTML = ''; // Clear bookmark markers
  recordingPlayhead.style.display = 'none'; // Hide playhead until bookmark starts
  recordingPlayhead.style.left = '50%';
  recordingPlayhead.style.transform = 'translateX(-50%)';
  
  // Remove all section-view classes and arrangement class
  waveformZone.className = waveformZone.className.replace(/section-view-\d/g, '').trim();
  waveformZone.classList.add('visible', 'recording');
  waveformZone.classList.remove('has-clip', 'playing', 'arrangement');
  waveformZone.style.removeProperty('--loop-duration');
  
  document.getElementById('mic-btn').classList.add('rec');
  document.getElementById('waveform-timer').textContent = '0:00';
  document.getElementById('waveform-timer').style.display = '';
  
  // Check if we're overdubbing (recording while looping)
  if (isLooping && selectedClipId) {
    overdubClipId = selectedClipId;
    const loopingClip = clips.find(c => c.id === overdubClipId);
    
    // Hide main waveform timer (timer is in looping clip bar instead)
    document.getElementById('waveform-timer').style.display = 'none';
    document.getElementById('looping-clip-timer').textContent = '0:00';
    
    // Show looping clip bar with waveform
    document.getElementById('looping-clip-name').textContent = loopingClip.name;
    document.getElementById('looping-clip-bar').classList.add('visible');
    
    // Parse looping clip duration for animation
    const parts = loopingClip.duration.split(':');
    const secs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
    const loopDuration = Math.max(secs * 2, 2); // double duration, min 2s
    
    // Populate waveform in the looping clip bar
    const loopingWaveform = document.getElementById('looping-waveform');
    loopingWaveform.style.setProperty('--loop-duration', `${loopDuration}s`);
    loopingWaveform.innerHTML = 
      loopingClip.bars.map(h => `<div class="waveform-bar" style="height:${Math.round(h * 30)}px"></div>`).join('') +
      '<div class="looping-waveform-progress"></div>';
    
    // Close clips overlay
    hideClipsView();
    
    showToast('Overdubbing...');
  } else {
    overdubClipId = null;
    // Close clips overlay when starting to record
    hideClipsView();
    showToast('Recording...');
  }
  
  timerIv = setInterval(() => {
    timerSecs++;
    const m = Math.floor(timerSecs/60), s = timerSecs%60;
    const timeStr = `${m}:${s.toString().padStart(2,'0')}`;
    document.getElementById('waveform-timer').textContent = timeStr;
    // Also update looping clip bar timer if overdubbing
    if (overdubClipId) {
      document.getElementById('looping-clip-timer').textContent = timeStr;
    }
  }, 1000);
  
  waveIv = setInterval(addWaveformBar, 50);
}

function stopRecording() {
  if (!isRec) return;
  isRec = false; 
  clearInterval(timerIv);
  clearInterval(waveIv);
  
  // Auto-close any active bookmark at current recording time
  if (activeBookmark !== null) {
    activeBookmark.endTime = timerSecs * 1000;
    bookmarks.push(activeBookmark);
    activeBookmark = null;
    document.getElementById('recording-playhead').style.display = 'none';
  }
  
  // Hide looping clip bar and clean up overdub state
  document.getElementById('looping-clip-bar').classList.remove('visible');
  document.getElementById('looping-waveform').innerHTML = '';
  
  let finalDuration;
  let linkedClipId = null;
  let linkedClipEnabled = true;
  
  // If overdubbing, use the looping clip's duration
  if (overdubClipId) {
    const loopingClip = clips.find(c => c.id === overdubClipId);
    finalDuration = loopingClip.duration;
    linkedClipId = overdubClipId;
    
    // Stop the loop
    isLooping = false;
    document.getElementById('waveform-loop-btn').classList.remove('active');
  } else {
    const m = Math.floor(timerSecs/60), s = timerSecs%60;
    finalDuration = `${m}:${s.toString().padStart(2,'0')}`;
  }
  
  // If recording while in section view, auto-tag to that section
  const autoTagSection = selectedSection ? [selectedSection] : [];
  const autoArrangementEnabled = selectedSection ? true : undefined;
  
  // Create clips based on bookmark regions
  if (bookmarks.length > 0 && !overdubClipId) {
    // Create a clip for each bookmarked region
    for (let i = 0; i < bookmarks.length; i++) {
      const region = bookmarks[i];
      // Calculate duration from time range (ms to seconds)
      const segmentMs = region.endTime - region.startTime;
      const segmentSecs = Math.max(1, Math.round(segmentMs / 1000));
      const m = Math.floor(segmentSecs / 60), s = segmentSecs % 60;
      const durationStr = `${m}:${s.toString().padStart(2, '0')}`;
      
      // Extract bars for this time segment
      const segmentBars = recordingBars.filter((_, idx) => {
        const barTime = barTimeMap[idx];
        return barTime >= region.startTime && barTime <= region.endTime;
      });
      
      clips.unshift({ 
        id: uid(), 
        name: `Recording ${clipN++}`, 
        duration: durationStr, 
        sections: [...autoTagSection],
        arrangementEnabled: autoArrangementEnabled,
        instrument: INSTRUMENTS[Math.floor(Math.random() * INSTRUMENTS.length)],
        bars: segmentBars.length > 0 ? segmentBars : genBars(),
        linkedClipId: null,
        linkedClipEnabled: true
      });
    }
    showToast(`${bookmarks.length} clip${bookmarks.length > 1 ? 's' : ''} created from bookmarks`);
  } else {
    // No bookmarks - create single clip
    clips.unshift({ 
      id: uid(), 
      name: `Recording ${clipN++}`, 
      duration: finalDuration, 
      sections: autoTagSection,
      arrangementEnabled: autoArrangementEnabled,
      instrument: INSTRUMENTS[Math.floor(Math.random() * INSTRUMENTS.length)],
      bars: genBars(),
      linkedClipId: linkedClipId,
      linkedClipEnabled: linkedClipEnabled
    });
    
    if (overdubClipId) {
      showToast(`Overdub saved — ${finalDuration}`);
    } else {
      showToast(`Clip saved — ${finalDuration}`);
    }
  }
  
  overdubClipId = null;
  
  // Keep waveform visible
  document.getElementById('mic-btn').classList.remove('rec');
  document.getElementById('recording-playhead').style.display = 'none';
  const waveformZone = document.getElementById('waveform-zone');
  waveformZone.classList.remove('recording');
  
  // If we have bookmarks, show full recording waveform with highlighted regions
  if (bookmarks.length > 0) {
    showRecordingWithBookmarks();
  } else {
    // Select the new clip and show its waveform
    selectedClipId = clips[0].id;
    showClipInWaveform(clips[0]);
  }
  
  updateClipsBadge();
  updateLoopButtonVisibility();
  renderClipsList(); // Update clips list if overlay is open
}

// ── PLAY ARRANGEMENT OR CLIP ────────────────────────
let isPlaying = false;

function playArrangementOrClip() {
  // If already playing, stop
  if (isPlaying) {
    stopPlayback();
    return;
  }
  
  // Check if any clips have sections (arrangement exists)
  const hasArrangement = clips.some(c => c.sections && c.sections.length > 0 && c.arrangementEnabled !== false);
  
  // If in section view (a section tab is selected), play only clips in that section
  if (selectedSection) {
    const sectionClips = clips.filter(c => 
      c.sections.includes(selectedSection) && c.arrangementEnabled !== false
    );
    if (sectionClips.length > 0) {
      selectedClipId = null;
      renderClipsList();
      playSectionClips(sectionClips);
      return;
    }
  }
  
  // If arrangement exists, play full arrangement (all sections in sequence)
  if (hasArrangement) {
    selectedClipId = null;
    renderClipsList();
    playArrangement();
  } else if (clips.length > 0) {
    // No arrangement - play first clip
    playClip(clips[0].id);
  } else {
    showToast('No clips to play');
  }
}

function playSectionClips(sectionClips) {
  // Play clips in the section (simplified - plays first clip for now)
  if (sectionClips.length > 0) {
    startPlayback(sectionClips[0]);
    showToast(`Playing ${selectedSection}`);
  }
}

// ── CLIPS BADGE & BOTTOM LEFT VISIBILITY ────────────────────────
function updateClipsBadge() {
  const badge = document.getElementById('clips-badge');
  const bottomLeft = document.getElementById('bottom-left');
  
  if (clips.length > 0) {
    badge.style.display = '';
    badge.textContent = clips.length;
    bottomLeft.classList.add('visible');
  } else {
    badge.style.display = 'none';
    bottomLeft.classList.remove('visible');
  }
}

// ── CLIPS VIEW ─────────────────────────
function toggleClipsView() {
  const view = document.getElementById('clips-view');
  if (view.classList.contains('visible')) {
    hideClipsView();
  } else {
    showClipsView();
  }
}

function showClipsView() {
  renderClipsList();
  document.getElementById('clips-view').classList.add('visible');
  document.getElementById('clips-hint-container').classList.add('visible');
  document.getElementById('bottom-left').classList.add('clips-open');
}

function hideClipsView() {
  document.getElementById('clips-view').classList.remove('visible');
  document.getElementById('clips-hint-container').classList.remove('visible');
  document.getElementById('bottom-left').classList.remove('clips-open');
  // Hide section tabs when clips overlay closes
  document.getElementById('section-tabs-row').classList.remove('visible');
  selectedSection = null;
  // Remove section-view class from clips view
  const clipsView = document.getElementById('clips-view');
  clipsView.className = clipsView.className.replace(/section-view-\d/g, '').trim();
}

function setupSwipeToHide() {
  const handle = document.getElementById('clips-drag-handle');
  const view = document.getElementById('clips-view');
  let startY = 0;
  
  handle.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
  });
  
  handle.addEventListener('touchmove', (e) => {
    const diff = e.touches[0].clientY - startY;
    if (diff > 50) {
      hideClipsView();
    }
  });
  
  handle.addEventListener('mousedown', (e) => {
    startY = e.clientY;
    const onMove = (e) => {
      if (e.clientY - startY > 50) {
        hideClipsView();
        document.removeEventListener('mousemove', onMove);
      }
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', () => {
      document.removeEventListener('mousemove', onMove);
    }, { once: true });
  });
}

// ── SECTION TABS ──────────────────────
function renderSectionTabs() {
  const tabsContainer = document.getElementById('section-tabs');
  const tabsRow = document.getElementById('section-tabs-row');
  
  // Show section tabs if any clips have sections
  const hasClipsWithSections = clips.some(c => c.sections && c.sections.length > 0);
  
  if (hasClipsWithSections) {
    sectionTabsVisible = true;
    tabsRow.classList.add('visible');
  } else {
    tabsRow.classList.remove('visible');
  }
  
  // Show sections in the order they appear in the global sections array
  const sectionsWithClips = sections.filter(s => 
    clips.some(c => c.sections && c.sections.includes(s))
  );
  
  // If a section is selected, show only that section tab full-width with X button
  if (selectedSection) {
    const sectionIndex = sections.indexOf(selectedSection);
    const pastelColors = ['#dbeafe', '#ede9fe', '#fce7f3', '#d1fae5', '#fef3c7', '#ffedd5'];
    const textColors = ['#1e40af', '#5b21b6', '#9d174d', '#065f46', '#92400e', '#9a3412'];
    const borderColors = ['#2563eb', '#7c3aed', '#db2777', '#059669', '#d97706', '#ea580c'];
    
    tabsContainer.innerHTML = `
      <div class="section-tab selected full-width" 
           style="background:${pastelColors[sectionIndex % 6]}; color:${textColors[sectionIndex % 6]}; border-color:${borderColors[sectionIndex % 6]}; flex:1;">
        ${selectedSection}
        <span class="section-tab-close" onclick="event.stopPropagation(); clearSectionSelection()">✕</span>
      </div>`;
  } else {
    // Show all section tabs
    tabsContainer.innerHTML = sectionsWithClips.map(s => {
      const isSelected = selectedSection === s;
      const hasClips = clips.some(c => c.sections.includes(s) && c.arrangementEnabled !== false);
      return `<div class="section-tab ${isSelected ? 'selected' : ''} ${hasClips ? 'has-clips' : ''}" 
           onclick="selectSection('${s}')">${s}</div>`;
    }).join('');
  }
}

function clearSectionSelection() {

  const clipsView = document.getElementById('clips-view');
  clipsView.className = clipsView.className.replace(/section-view-\d/g, '').trim();

function selectSection(sectionName) {

  const clipsView = document.getElementById('clips-view');

function showSectionTabs() {

  renderSectionTabs();
}

function closeSectionTabs() {

  document.getElementById('section-tabs-row').classList.remove('visible');

function toggleClipSection(clipId, sectionName) {

// Toggle clip in/out of the currently selected section (via radio button)
function toggleClipInSection(clipId, sectionName) {

function addNewSection() {

    }
    showToast(`Section "${name.trim()}" created`);

}

let arrangementPlaybackInterval = null;
let currentArrangementSection = 0;

function playArrangement() {
  // Get all unique sections from clips that have arrangement enabled
  const allSectionsFromClips = [...new Set(
    clips
      .filter(c => c.sections && c.sections.length > 0 && c.arrangementEnabled !== false)
      .flatMap(c => c.sections)
  )];
  
  // Order sections by the global sections array order (if they exist there)
  const sectionsWithClips = allSectionsFromClips.sort((a, b) => {
    const aIdx = sections.indexOf(a);
    const bIdx = sections.indexOf(b);
    if (aIdx === -1 && bIdx === -1) return 0;
    if (aIdx === -1) return 1;
    if (bIdx === -1) return -1;
    return aIdx - bIdx;
  });
  
  if (sectionsWithClips.length === 0) {
    showToast('No clips in arrangement');
    return;
  }
  
  // Build arrangement data: for each section, get clips and calculate duration
  const arrangementData = sectionsWithClips.map(sectionName => {
    const sectionClips = clips.filter(c => 
      c.sections && c.sections.includes(sectionName) && c.arrangementEnabled !== false
    );
    // Use longest clip duration for section
    let maxDuration = 0;
    sectionClips.forEach(c => {
      const parts = c.duration.split(':');
      const secs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      if (secs > maxDuration) maxDuration = secs;
    });
    // Combine waveform bars from first clip (or average them)
    const bars = sectionClips[0] ? sectionClips[0].bars : [];
    return { name: sectionName, clips: sectionClips, duration: maxDuration || 3, bars };
  });
  
  // Calculate total duration
  const totalDuration = arrangementData.reduce((sum, s) => sum + s.duration, 0);
  
  // Update section tabs to only show sections with clips (with proportional widths)
  renderArrangementTabs(arrangementData, totalDuration);
  
  // Build combined waveform with section dividers
  showArrangementWaveform(arrangementData, totalDuration);
  
  // Start playback animation
  startArrangementPlayback(arrangementData, totalDuration);
  
  showToast('Playing arrangement...');
}

function renderArrangementTabs(arrangementData, totalDuration) {
  const tabsContainer = document.getElementById('section-tabs');
  tabsContainer.innerHTML = arrangementData.map((section, i) => {
    const widthPercent = (section.duration / totalDuration) * 100;
    return `<div class="section-tab ${i === 0 ? 'active' : ''}" data-section="${section.name}" 
                 style="flex: ${section.duration}; min-width: 0;">${section.name}</div>`;
  }).join('');
}

function showArrangementWaveform(arrangementData, totalDuration) {
  const zone = document.getElementById('waveform-zone');
  const display = document.getElementById('waveform-display');
  const timer = document.getElementById('waveform-timer');
  
  zone.classList.add('visible', 'has-clip', 'arrangement');
  timer.style.display = 'none';
  
  // Section colors
  const sectionColors = ['#60a5fa', '#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#fb923c'];
  
  // Calculate width proportions for each section
  const totalBars = 120; // More bars to fill width
  let html = '';
  
  arrangementData.forEach((section, idx) => {
    const sectionProportion = section.duration / totalDuration;
    const sectionBars = Math.max(Math.round(totalBars * sectionProportion), 5);
    const color = sectionColors[idx % sectionColors.length];
    
    // Add bars for this section with section-specific color
    const bars = section.bars.length > 0 ? section.bars : Array(sectionBars).fill(0.5);
    const step = bars.length / sectionBars;
    
    for (let i = 0; i < sectionBars; i++) {
      const barIdx = Math.floor(i * step);
      const h = bars[barIdx] || 0.5;
      html += `<div class="waveform-bar" style="height:${Math.round(h * 50)}px; background:${color}"></div>`;
    }
  });
  
  display.innerHTML = html;
}

// Show arrangement preview in waveform (without playing)
function showArrangementPreview() {
  const zone = document.getElementById('waveform-zone');
  // Remove any section-view classes when showing full arrangement
  zone.className = zone.className.replace(/section-view-\d/g, '').trim();
  
  const hasArrangement = clips.some(c => c.sections && c.sections.length > 0 && c.arrangementEnabled !== false);
  if (!hasArrangement) return;
  
  // Get sections with clips in order
  const sectionsWithClips = sections.filter(s => 
    clips.some(c => c.sections && c.sections.includes(s) && c.arrangementEnabled !== false)
  );
  
  if (sectionsWithClips.length === 0) return;
  
  // Build arrangement data
  const arrangementData = sectionsWithClips.map(sectionName => {
    const sectionClips = clips.filter(c => 
      c.sections && c.sections.includes(sectionName) && c.arrangementEnabled !== false
    );
    let maxDuration = 0;
    sectionClips.forEach(c => {
      const parts = c.duration.split(':');
      const secs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
      if (secs > maxDuration) maxDuration = secs;
    });
    const bars = sectionClips[0] ? sectionClips[0].bars : [];
    return { name: sectionName, clips: sectionClips, duration: maxDuration || 3, bars };
  });
  
  const totalDuration = arrangementData.reduce((sum, s) => sum + s.duration, 0);
  showArrangementWaveform(arrangementData, totalDuration);
}

// Show single section waveform with section color
function showSectionWaveform(sectionName) {
  const zone = document.getElementById('waveform-zone');
  const display = document.getElementById('waveform-display');
  const timer = document.getElementById('waveform-timer');
  
  const sectionClips = clips.filter(c => 
    c.sections && c.sections.includes(sectionName) && c.arrangementEnabled !== false
  );
  
  if (sectionClips.length === 0) {
    zone.classList.remove('visible');
    return;
  }
  
  // Remove any previous section-view classes
  zone.className = zone.className.replace(/section-view-\d/g, '').trim();
  
  zone.classList.add('visible', 'has-clip');
  zone.classList.remove('arrangement');
  timer.style.display = 'none';
  
  // Get section color based on index and add section-view class for border
  const sectionColors = ['#60a5fa', '#a78bfa', '#f472b6', '#34d399', '#fbbf24', '#fb923c'];
  const sectionIndex = sections.indexOf(sectionName);
  const color = sectionColors[sectionIndex % sectionColors.length];
  
  // Add section-view class for colored border (1-indexed for CSS)
  zone.classList.add(`section-view-${sectionIndex + 1}`);
  
  // Use first clip's bars with section color
  const bars = sectionClips[0].bars || [];
  display.innerHTML = bars.map(h => 
    `<div class="waveform-bar" style="height:${Math.round(h * 50)}px; background:${color}"></div>`
  ).join('');
}

function startArrangementPlayback(arrangementData, totalDuration) {
  const zone = document.getElementById('waveform-zone');
  const tabsRow = document.getElementById('section-tabs-row');
  
  // Set up progress animation
  zone.style.setProperty('--loop-duration', `${totalDuration}s`);
  zone.classList.add('playing');
  tabsRow.classList.add('playing');
  
  // Track current section for highlighting
  currentArrangementSection = 0;
  let elapsedTime = 0;
  let sectionEndTimes = [];
  let cumulative = 0;
  arrangementData.forEach(s => {
    cumulative += s.duration;
    sectionEndTimes.push(cumulative);
  });
  
  // Update active section tab during playback
  arrangementPlaybackInterval = setInterval(() => {
    elapsedTime += 0.5;
    
    // Check if we've moved to next section
    while (currentArrangementSection < sectionEndTimes.length - 1 && 
           elapsedTime >= sectionEndTimes[currentArrangementSection]) {
      currentArrangementSection++;
      // Update active tab
      const tabs = document.querySelectorAll('.section-tab');
      tabs.forEach((tab, i) => {
        tab.classList.toggle('active', i === currentArrangementSection);
      });
    }
    
    // Check if playback complete
    if (elapsedTime >= totalDuration) {
      stopArrangementPlayback();
    }
  }, 500);
}

function stopArrangementPlayback() {
  if (arrangementPlaybackInterval) {
    clearInterval(arrangementPlaybackInterval);
    arrangementPlaybackInterval = null;
  }
  const zone = document.getElementById('waveform-zone');
  const tabsRow = document.getElementById('section-tabs-row');
  
  // Reset waveform zone classes
  zone.classList.remove('playing', 'arrangement');
  zone.className = zone.className.replace(/section-view-\d/g, '').trim();
  zone.style.removeProperty('--loop-duration');
  tabsRow.classList.remove('playing');
  
  // Reset isPlaying state
  isPlaying = false;
  updatePlayButtonIcon();
  removePulsingFromClips();
  
  // Re-render normal section tabs with click handlers
  renderSectionTabs();
  
  // Show arrangement preview waveform
  showArrangementPreview();
  
  showToast('Arrangement complete');
}

function renderClipsList() {
  const list = document.getElementById('clips-list');
  
  if (clips.length === 0) {
    list.innerHTML = '<div class="clips-empty">No recordings yet.<br>Tap the mic to start.</div>';
    return;
  }
  
  // Sort clips: if section selected, bring clips in section to top, with arrangement-enabled first
  let sortedClips = [...clips];
  if (selectedSection) {
    const inSectionEnabled = clips.filter(c => 
      c.sections && c.sections.includes(selectedSection) && c.arrangementEnabled !== false
    );
    const inSectionDisabled = clips.filter(c => 
      c.sections && c.sections.includes(selectedSection) && c.arrangementEnabled === false
    );
    const notInSection = clips.filter(c => !c.sections || !c.sections.includes(selectedSection));
    sortedClips = [...inSectionEnabled, ...inSectionDisabled, ...notInSection];
  }
  
  list.innerHTML = sortedClips.map(clip => {
    // Radio button logic:
    // - In section view: show for clips IN that section, toggles arrangementEnabled
    // - In all clips view: show for clips in any section, toggles arrangementEnabled
    const isInAnySection = clip.sections && clip.sections.length > 0;
    const isInSelectedSection = selectedSection && clip.sections.includes(selectedSection);
    const isArrangementEnabled = clip.arrangementEnabled !== false;
    
    let radioBtn = '';
    if (selectedSection && isInSelectedSection) {
      // Section view - show radio only for clips in this section, toggle arrangement enabled
      radioBtn = `<span class="clip-radio ${isArrangementEnabled ? 'on' : ''}" 
            onclick="event.stopPropagation(); toggleArrangement(${clip.id})"></span>`;
    } else if (!selectedSection && isInAnySection) {
      // All clips view - show radio for clips in sections, toggle arrangement enabled
      radioBtn = `<span class="clip-radio ${isArrangementEnabled ? 'on' : ''}" 
            onclick="event.stopPropagation(); toggleArrangement(${clip.id})"></span>`;
    }
    
    // In section view, add pastel stroke to clip cards with arrangement enabled
    let cardStyle = '';
    if (selectedSection && isInSelectedSection && isArrangementEnabled) {
      const sectionIndex = sections.indexOf(selectedSection);
      const borderColors = ['#2563eb', '#7c3aed', '#db2777', '#059669', '#d97706', '#ea580c'];
      cardStyle = `border-color: ${borderColors[sectionIndex % 6]};`;
    }
    
    return `
    <div class="clip-card ${clip.id === selectedClipId ? 'selected' : ''}" 
         style="${cardStyle}"
         onclick="selectClip(${clip.id})" data-id="${clip.id}">
      ${radioBtn}
      <div class="clip-menu" onclick="event.stopPropagation(); showClipMenu(${clip.id})">⋮</div>
      <div class="clip-main">
        <div class="clip-thumbnail">
          ${clip.instrument}
          <div class="clip-play-btn" onclick="event.stopPropagation(); playClip(${clip.id})">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="clip-content">
          <div class="clip-header">
            <div class="clip-name">${clip.name}</div>
          </div>
          <div class="clip-waveform-line"></div>
          <div class="clip-duration">${clip.duration}</div>
        </div>
      </div>
      <div class="clip-sections">
        ${sections.length === 0 ? `
          <div class="clip-add-to-song" onclick="event.stopPropagation(); addToSong(${clip.id})">Add to Song</div>
        ` : `
          ${sections.map((s, idx) => {
            const isInSection = clip.sections.includes(s);
            const pastelColors = ['#dbeafe', '#ede9fe', '#fce7f3', '#d1fae5', '#fef3c7', '#ffedd5'];
            const textColors = ['#1e40af', '#5b21b6', '#9d174d', '#065f46', '#92400e', '#9a3412'];
            const borderColors = ['#2563eb', '#7c3aed', '#db2777', '#059669', '#d97706', '#ea580c'];
            const bgColor = isInSection ? pastelColors[idx % 6] : 'var(--surface2)';
            const txtColor = isInSection ? textColors[idx % 6] : 'var(--muted)';
            const bdrColor = isInSection ? borderColors[idx % 6] : 'var(--border)';
            return `<div class="clip-section-tag ${isInSection ? 'active' : ''}" 
                 style="background:${bgColor}; color:${txtColor}; border-color:${bdrColor};"
                 onclick="event.stopPropagation(); toggleClipSection(${clip.id}, '${s}')">${s}</div>`;
          }).join('')}
          <div class="clip-add-section" onclick="event.stopPropagation(); addNextSection(${clip.id})">+</div>
        `}
      </div>
    </div>
  `}).join('');
}

// Auto section names in order
const AUTO_SECTIONS = ['Verse', 'Chorus', 'Bridge', 'Outro', 'Intro', 'Pre-Chorus', 'Hook'];

function addToSong(clipId) {
  // First clip added - create "Verse" section
  const sectionName = 'Verse';
  if (!sections.includes(sectionName)) {
    sections.push(sectionName);
  }
  const clip = clips.find(c => c.id === clipId);
  if (clip && !clip.sections.includes(sectionName)) {
    clip.sections.push(sectionName);
    clip.arrangementEnabled = true;
  }
  sectionTabsVisible = true;
  showToast(`Added to ${sectionName}`);
  renderClipsList();
  renderSectionTabs();
  showArrangementPreview();
}

function addNextSection(clipId) {
  // Find next auto section name that doesn't exist yet
  let nextSection = null;
  for (const name of AUTO_SECTIONS) {
    if (!sections.includes(name)) {
      nextSection = name;
      break;
    }
  }
  // If all auto names used, create numbered one
  if (!nextSection) {
    nextSection = `Section ${sections.length + 1}`;
  }
  
  sections.push(nextSection);
  const clip = clips.find(c => c.id === clipId);
  if (clip && !clip.sections.includes(nextSection)) {
    clip.sections.push(nextSection);
    clip.arrangementEnabled = true;
  }
  sectionTabsVisible = true;
  showToast(`Added to ${nextSection}`);
  renderClipsList();
  renderSectionTabs();
  showArrangementPreview();
}

function addNewSectionForClip(clipId) {
  const name = prompt('Enter section name:');
  if (name && name.trim()) {
    if (!sections.includes(name.trim())) {
      sections.push(name.trim());
    }
    // Add clip to the new section
    const clip = clips.find(c => c.id === clipId);
    if (clip && !clip.sections.includes(name.trim())) {
      clip.sections.push(name.trim());
    }
    // Show section tabs when clip is added (but don't auto-navigate)
    sectionTabsVisible = true;
    showToast(`Added to ${name.trim()}`);
    renderClipsList();
    renderSectionTabs();
  }
}

function selectClip(id) {
  selectedClipId = selectedClipId === id ? null : id;
  renderClipsList();
  updateLoopButtonVisibility();
  
  const clip = clips.find(c => c.id === id);
  if (clip && selectedClipId) {
    showClipInWaveform(clip);
    showToast(`Selected: ${clip.name}`);
  } else {
    // No clip selected, hide waveform
    document.getElementById('waveform-zone').classList.remove('visible', 'has-clip');
  }
}

function toggleArrangement(clipId) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  
  clip.arrangementEnabled = clip.arrangementEnabled === false ? true : false;
  renderClipsList();
  showToast(`${clip.name} ${clip.arrangementEnabled ? 'added to' : 'removed from'} arrangement`);
}

function showClipInWaveform(clip) {
  const zone = document.getElementById('waveform-zone');
  const display = document.getElementById('waveform-display');
  const timer = document.getElementById('waveform-timer');
  
  zone.classList.add('visible', 'has-clip');
  // Hide timer when viewing clips (only show during recording)
  timer.style.display = 'none';
  
  // Fill with clip's waveform bars
  display.innerHTML = clip.bars.map(h => 
    `<div class="waveform-bar" style="height:${Math.round(h * 50)}px"></div>`
  ).join('');

function updateLoopButtonVisibility() {
  const bottomRight = document.getElementById('bottom-right');
  if (selectedClipId) {
    bottomRight.classList.add('visible');
  } else {
    bottomRight.classList.remove('visible');
  }
}

function toggleLinkedClip(clipId) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  
  clip.linkedClipEnabled = !clip.linkedClipEnabled;
  renderClipsList();
  
  const linkedClip = clips.find(c => c.id === clip.linkedClipId);
  if (linkedClip) {
    showToast(`${linkedClip.name} ${clip.linkedClipEnabled ? 'on' : 'off'}`);
  }
}

function playClip(id) {
  const clip = clips.find(c => c.id === id);
  if (!clip) return;
  
  // Select this clip and show in waveform
  selectedClipId = id;
  showClipInWaveform(clip);
  renderClipsList();
  updateLoopButtonVisibility();
  
  // Start playback animation
  startPlayback(clip);
}

function playSelectedClip() {
  if (selectedClipId) {
    const clip = clips.find(c => c.id === selectedClipId);
    if (clip) startPlayback(clip);
  } else {
    showToast('Select a clip to play');
  }
}

function startPlayback(clip) {
  const zone = document.getElementById('waveform-zone');
  
  // Parse duration to seconds for animation timing (doubled for better visual)
  const parts = clip.duration.split(':');
  const secs = parseInt(parts[0]) * 60 + parseInt(parts[1]);
  const duration = Math.max(secs * 2, 2); // double the duration, minimum 2 seconds
  
  // Set CSS variable for animation duration
  zone.style.setProperty('--loop-duration', `${duration}s`);
  
  // Stop any existing playback first
  zone.classList.remove('playing');
  
  // Force reflow to restart animation
  void zone.offsetWidth;
  
  // Start playing
  zone.classList.add('playing');
  isPlaying = true;
  updatePlayButtonIcon();
  addPulsingToActiveClips();
  
  if (isLooping) {
    showToast(`Looping: ${clip.name}`);
  } else {
    showToast(`Playing: ${clip.name}`);
    // Stop after one play if not looping
    setTimeout(() => {
      if (!isLooping) {
        stopPlayback();
      }
    }, duration * 1000);
  }
}

function stopPlayback() {
  document.getElementById('waveform-zone').classList.remove('playing');
  isPlaying = false;
  updatePlayButtonIcon();
  removePulsingFromClips();
}

function updatePlayButtonIcon() {
  const playBtn = document.querySelector('.waveform-play-btn');
  if (!playBtn) return;
  
  if (isPlaying) {
    // Show pause icon
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
  } else {
    // Show play icon
    playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  }
}

function addPulsingToActiveClips() {
  // Add pulsing class to all active radio buttons
  document.querySelectorAll('.clip-radio.on').forEach(el => {
    el.classList.add('pulsing');
  });
}

function removePulsingFromClips() {
  document.querySelectorAll('.clip-radio.pulsing').forEach(el => {
    el.classList.remove('pulsing');
  });
}

function showClipMenu(id) {
  showToast('Clip options...');
}

// ── SECTIONS ───────────────────────────

function removeFromSection(clipId, sectionName) {
  const clip = clips.find(c => c.id === clipId);
  if (!clip) return;
  
  const idx = clip.sections.indexOf(sectionName);
  if (idx >= 0) {
    clip.sections.splice(idx, 1);
    showToast(`Removed from ${sectionName}`);
    renderClipsList();
    renderSectionTabs();
  }
}

function addNewSection() {
  const name = prompt('Section name:');
  if (name && name.trim()) {
    const trimmed = name.trim();
    if (!sections.includes(trimmed)) {
      sections.push(trimmed);
    }
    toggleSection(trimmed);
  }
}

// ── LOOP ───────────────────────────────
function toggleLoop() {
  isLooping = !isLooping;
  document.getElementById('waveform-loop-btn').classList.toggle('active', isLooping);
  
  if (isLooping) {
    // Loop whatever is currently in the waveform
    if (isPlaying) {
      // Already playing, just enable loop mode
      showToast('Loop enabled');
    } else if (selectedClipId) {
      // Start looping the selected clip
      const clip = clips.find(c => c.id === selectedClipId);
      if (clip) startPlayback(clip);
    } else {
      // Check if arrangement is showing
      const hasArrangement = clips.some(c => c.sections && c.sections.length > 0 && c.arrangementEnabled !== false);
      if (hasArrangement) {
        playArrangement();
        showToast('Looping arrangement');
      } else {
        showToast('Loop enabled - play something to loop');
      }
    }
  } else {
    // Stop looping
    stopPlayback();
    showToast('Loop disabled');
  }
}

function stopLooping() {
  isLooping = false;
  document.getElementById('waveform-loop-btn').classList.remove('active');
  stopPlayback();
  showToast('Stopped');
}

// ── TOAST ──────────────────────────────
let toastT;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; 
  t.classList.add('show');
  clearTimeout(toastT); 
  toastT = setTimeout(() => t.classList.remove('show'), 2000);
}

boot();
</script>
</body>
</html>
