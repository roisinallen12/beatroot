<div class="record-screen">

  <div class="time-ruler">
    <span>00:01</span>
    <span>00:02</span>
    <span>00:03</span>
    <span>00:04</span>
    <span>00:05</span>
  </div>

  <div class="timeline-canvas">
    <canvas class="recording-canvas" aria-hidden="true"></canvas>

    <div class="tick-line" style="left:0%"></div>
    <div class="tick-line" style="left:25%"></div>
    <div class="tick-line" style="left:50%"></div>
    <div class="tick-line" style="left:75%"></div>
    <div class="tick-line" style="left:100%"></div>

    <div class="scrubber-col" style="left:50%">
      <div class="scrubber-handle"></div>
      <div class="scrubber-handle"></div>
    </div>
  </div>

  <p class="bookmark-hint">Tap anywhere to bookmark</p>

</div>
