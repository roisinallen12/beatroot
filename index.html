<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beatroot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>

  <div id="app">

    <!-- Phone status bar -->
    <div id="phone-status-bar" aria-hidden="true">
      <span class="status-time">9:41</span>
      <span class="status-notch"></span>
      <span class="status-icons">
        <!-- Signal bars -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
          <rect x="0" y="7" width="3" height="5" rx="0.5" fill="currentColor"/>
          <rect x="4.5" y="4.5" width="3" height="7.5" rx="0.5" fill="currentColor"/>
          <rect x="9" y="2" width="3" height="10" rx="0.5" fill="currentColor"/>
          <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="currentColor" opacity="0.3"/>
        </svg>
        <!-- WiFi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
          <path d="M8 9.5a1.2 1.2 0 110 2.4A1.2 1.2 0 018 9.5z" fill="currentColor"/>
          <path d="M4.5 7C5.7 5.8 6.8 5.2 8 5.2s2.3.6 3.5 1.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
          <path d="M1.8 4.3C3.7 2.4 5.7 1.4 8 1.4s4.3 1 6.2 2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" fill="none"/>
        </svg>
        <!-- Battery -->
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none">
          <rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" stroke-width="1"/>
          <rect x="2" y="2" width="16" height="8" rx="2" fill="currentColor"/>
          <path d="M23 4v4a2 2 0 000-4z" fill="currentColor" opacity="0.4"/>
        </svg>
      </span>
    </div>

    <!-- Top Navigation -->
    <header id="top-nav">
      <button class="top-nav-btn" id="back-btn" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M13 17l-5-6 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="top-nav-right">
        <button class="top-nav-btn" aria-label="Edit">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M15.5 3.5a2.121 2.121 0 013 3L7 18l-4 1 1-4 11.5-11.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="top-nav-btn" id="export-btn" aria-label="Share">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M8 10l3-4 3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="11" y1="6" x2="11" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5 15v2a2 2 0 002 2h8a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- View content is loaded here dynamically by app.js -->
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">

      <button class="nav-item active" data-view="lyrics">
        <span class="nav-pill">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8.24609 20.25H2.24609C1.84827 20.25 1.46674 20.092 1.18543 19.8107C0.904129 19.5294 0.746094 19.1478 0.746094 18.75V2.25C0.746094 1.85218 0.904129 1.47064 1.18543 1.18934C1.46674 0.908035 1.84827 0.75 2.24609 0.75H17.2461C17.6439 0.75 18.0255 0.908035 18.3068 1.18934C18.5881 1.47064 18.7461 1.85218 18.7461 2.25V9M8.24609 5.25H14.2461M5.24609 9.75H14.2461M5.24609 14.25H12.7461M22.6271 14.87L15.0001 22.5L11.2501 23.25L12.0001 19.5L19.6311 11.87C19.8274 11.6734 20.0605 11.5174 20.3171 11.4109C20.5737 11.3045 20.8488 11.2497 21.1266 11.2497C21.4044 11.2497 21.6795 11.3045 21.9361 11.4109C22.1927 11.5174 22.4258 11.6734 22.6221 11.87L22.6311 11.878C23.0273 12.2753 23.2494 12.8137 23.2486 13.3748C23.2479 13.9359 23.0243 14.4737 22.6271 14.87Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Lyrics</span>
        </span>
      </button>

      <button class="nav-item" data-view="clips">
        <span class="nav-pill">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12.75 0.75V24.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M6.75 5.8927V19.607" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M18.75 5.8927V19.607" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M0.75 9.32141V16.1786" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24.75 9.32141V16.1786" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Clips</span>
        </span>
      </button>

      <!-- Central Record Button -->
      <button class="nav-record" data-view="record" aria-label="Record">
        <span class="record-dot"></span>
      </button>

      <button class="nav-item" data-view="sections">
        <span class="nav-pill">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.052 20.25C22.2659 20.25 23.25 19.2659 23.25 18.052C23.25 16.8381 22.2659 15.854 21.052 15.854C19.8381 15.854 18.854 16.8381 18.854 18.052C18.854 19.2659 19.8381 20.25 21.052 20.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.552 23.25C11.7659 23.25 12.75 22.2659 12.75 21.052C12.75 19.8381 11.7659 18.854 10.552 18.854C9.33808 18.854 8.354 19.8381 8.354 21.052C8.354 22.2659 9.33808 23.25 10.552 23.25Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12.75 21.052V11.4C12.7498 10.9656 12.8864 10.5423 13.1404 10.1899C13.3944 9.83757 13.7529 9.57414 14.165 9.43699L20.527 7.70999C20.8379 7.60616 21.1691 7.57774 21.4932 7.62706C21.8173 7.67639 22.125 7.80205 22.3909 7.99368C22.6569 8.18532 22.8735 8.43743 23.0229 8.72924C23.1722 9.02104 23.2501 9.34418 23.25 9.67199V18.052" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.25 0.75H20.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.25 6.75H11.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.25 12.75H8.25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M1.125 1.5C0.917893 1.5 0.75 1.33211 0.75 1.125C0.75 0.917893 0.917893 0.75 1.125 0.75" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1.125 1.5C1.33211 1.5 1.5 1.33211 1.5 1.125C1.5 0.917893 1.33211 0.75 1.125 0.75" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1.125 6.75C0.917893 6.75 0.75 6.58211 0.75 6.375C0.75 6.16789 0.917893 6 1.125 6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1.125 6.75C1.33211 6.75 1.5 6.58211 1.5 6.375C1.5 6.16789 1.33211 6 1.125 6" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1.125 12.75C0.917893 12.75 0.75 12.5821 0.75 12.375C0.75 12.1679 0.917893 12 1.125 12" stroke="currentColor" stroke-width="1.5"/>
            <path d="M1.125 12.75C1.33211 12.75 1.5 12.5821 1.5 12.375C1.5 12.1679 1.33211 12 1.125 12" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          <span class="nav-label">Sections</span>
        </span>
      </button>

      <button class="nav-item" data-view="song">
        <span class="nav-pill">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V5L21 3V16M9 18C9 19.6569 7.65685 21 6 21C4.34315 21 3 19.6569 3 18C3 16.3431 4.34315 15 6 15C7.65685 15 9 16.3431 9 18ZM21 16C21 17.6569 19.6569 19 18 19C16.3431 19 15 17.6569 15 16C15 14.3431 16.3431 13 18 13C19.6569 13 21 14.3431 21 16Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">Song</span>
        </span>
      </button>

    </nav>

  </div>

  <!-- Export Modal -->
  <div id="export-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 id="modal-title">Export</h2>
      <p>Export functionality coming soon.</p>
      <button id="modal-close">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
