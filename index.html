<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beatroot</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>

  <div id="app">

    <!-- Top Navigation -->
    <header id="top-nav">
      <button class="top-nav-btn" id="back-btn" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M13 17l-5-6 5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="top-nav-right">
        <button class="top-nav-btn" aria-label="Edit">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M15.5 3.5a2.121 2.121 0 013 3L7 18l-4 1 1-4 11.5-11.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="top-nav-btn" id="export-btn" aria-label="Share">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M8 10l3-4 3 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="11" y1="6" x2="11" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5 15v2a2 2 0 002 2h8a2 2 0 002-2v-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content">
      <!-- View content is loaded here dynamically by app.js -->
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav">

      <button class="nav-item active" data-view="lyrics">
        <span class="nav-pill">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <rect x="4" y="2" width="14" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="7" y1="8" x2="15" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="7" y1="12" x2="15" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="7" y1="16" x2="11" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Lyrics</span>
        </span>
      </button>

      <button class="nav-item" data-view="clips">
        <span class="nav-pill">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <line x1="3" y1="9" x2="3" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="7" y1="6" x2="7" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="11" y1="3" x2="11" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="15" y1="6" x2="15" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="19" y1="9" x2="19" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Clips</span>
        </span>
      </button>

      <!-- Central Record Button -->
      <button class="nav-record" data-view="record" aria-label="Record">
        <span class="record-dot"></span>
      </button>

      <button class="nav-item" data-view="sections">
        <span class="nav-pill">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <line x1="2" y1="8" x2="11" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="2" y1="12" x2="11" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="2" y1="16" x2="11" y2="16" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <ellipse cx="16.5" cy="16.5" rx="2.5" ry="1.8" stroke="currentColor" stroke-width="1.4"/>
            <line x1="19" y1="16.5" x2="19" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="14" y1="10" x2="19" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Sections</span>
        </span>
      </button>

      <button class="nav-item" data-view="song">
        <span class="nav-pill">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <line x1="8" y1="4" x2="18" y2="4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="8" y1="4" x2="8" y2="15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="18" y1="4" x2="18" y2="13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <ellipse cx="6.5" cy="15.5" rx="2.5" ry="1.8" fill="currentColor"/>
            <ellipse cx="16.5" cy="13.5" rx="2.5" ry="1.8" fill="currentColor"/>
          </svg>
          <span class="nav-label">Song</span>
        </span>
      </button>

    </nav>

  </div>

  <!-- Export Modal -->
  <div id="export-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <h2 id="modal-title">Export</h2>
      <p>Export functionality coming soon.</p>
      <button id="modal-close">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
